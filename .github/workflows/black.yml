name: Code style (Black)

on:
  pull_request:

jobs:
  black:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install Black
        run: |
          python -m pip install --upgrade pip
          pip install black==24.8.0
      - name: Check formatting
        run: black --check --diff .
